name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release') }}"

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## Dozamigos Launcher v0.1.2

            Baixe o instalador NSIS abaixo. Versões já instaladas recebem as próximas atualizações automaticamente.

            ### Visual e notificações
            - Tema **retro-glitch** com tipografia e painéis alinhados ao restante do launcher
            - Notificações de atualização no estilo conquista, com opção de baixar em segundo plano ou depois
            - Avisos temporários (iniciar/encerrar Fortnite e erros) no mesmo formato

            ### Salve o Mundo
            - Histórico de **lhamas grátis** com os itens recebidos
            - Compra na loja STW mostrando corretamente o conteúdo das lhamas
            - Mais nomes de itens STW em português
            - Ferramentas extras: Party, Taxi, Boosts de XP, Matchmaking Track, World Info e SSD

            ### Conta e home
            - Aba **Customização** (apelido, tags e saldos na barra)
            - Jogos grátis da **Steam** (100% de desconto) na home, com notificação opcional
            - Tag **Só até hoje** na loja de itens e na exportação

            ### Outros
            - Encerrar Fortnite mais confiável (mata todos os processos do jogo)
            - Copy em português revisada
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
