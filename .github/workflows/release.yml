name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release') }}"

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## Dozamigos Launcher v0.1.11

            Baixe o instalador NSIS abaixo. Versões já instaladas recebem as próximas atualizações automaticamente.

            ### Loja do Salve o Mundo
            - Rotação de **Lhamas** com Fichas Raio-X na loja STW
            - Ao comprar uma lhama, o app **abre o pacote** e mostra os **itens recebidos** em um popup
            - Saldo de **Fichas Raio-X** na barra da conta (entre V-Bucks e Ouro)
            - Compra de lhama corrigida para usar o perfil certo da Epic (`common_core`)

            ### Temporada
            - Datas da temporada ao vivo via **api-fortnite.com** quando o calendário da Epic falha ou você não está logado
            - Removidas as datas fixas de fallback no herói da home

            ### Elementais
            - Nova página de **Elementais** com nomes em português, variantes e exportação

            ### Outros
            - Ícones locais de lhama e Fichas Raio-X
            - Ajustes de copy e limites na loja STW
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
