name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release') }}"

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## Dozamigos Launcher v0.1.3

            Baixe o instalador **Windows NSIS** (`.exe`) abaixo. Quem já tem o launcher instalado recebe a atualização automaticamente na próxima abertura.

            ### Arquivos desta release
            - `Dozamigos Launcher_0.1.3_x64-setup.exe` — instalador Windows (recomendado)
            - `latest.json` — manifesto da atualização automática
            - assinatura do instalador (usada pelo updater)

            ### Capítulo 7 — Temporada 4
            - **Elementais (Sprites)** atualizados para a temporada Override, com imagens locais e prévia ao clicar
            - Fallback de fim de temporada em **31/10/2026** quando a API não traz a data
            - **Vazamentos** por dia, com blur de build/AES, prévia dos itens e exportação em WebP

            ### Salve o Mundo
            - Correção dos **alertas de missão** (agora usam o token da conta logada; a Epic bloqueou client credentials)
            - Notificações do Windows quando há **V-Bucks** nas missões ou a rotação de alertas muda

            ### Notificações
            - Toasts nativos no mesmo estilo de sempre (ex.: “Saiu da base STW”)
            - Avisos curtos para lhamas grátis, reset de missões diárias e atualização da **loja do BR**
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
