name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release') }}"

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## Dozamigos Launcher v0.1.6

            Baixe o instalador **Windows NSIS** (`.exe`) abaixo. Quem já tem o launcher instalado recebe o aviso de atualização na próxima abertura.

            ### Arquivos desta release
            - `Dozamigos Launcher_0.1.6_x64-setup.exe` — instalador Windows (recomendado)
            - `latest.json` — manifesto da atualização automática
            - assinatura do instalador (usada pelo updater)

            ### Loja, vestiário e vazamentos
            - Fundos de raridade nos cards e nas prévias
            - Prévia em vídeo sem barras pretas; mudo em emote e música
            - Vestiário: aba Mascote, categorias em dropdown, exportação mais rápida com popup e Abrir imagem
            - Exportação da loja ignora Jam Tracks e a seção Mais da loja

            ### Navegação
            - BR abre na Loja de Itens, SaM nos Alertas, Conta em Conta, Epic/Steam em Jogos Gratuitos
            - Removidos Passe de Batalha, Visão geral, Missões de campanha, EULA e Party
            - Aba Menu saiu das configurações; Integrações só aparece em DEV

            ### Salve o Mundo
            - Loja STW: lhamas invisíveis filtradas; ícones corretos de Plano Raro e Épico
            - Taco e extrator portátil dos Elementais com os ícones certos

            ### Outros
            - Status dos servidores volta a funcionar
            - Status BR pela Fortnite-API
            - ./admin panel com lista de códigos no estilo do painel
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
